[project]
name = "telephony-mcp"
version = "0.2.0"
description = "FastMCP 3.2 Telephony Bridge — emergency calls via Asterisk/ARI+speechops TTS or Twilio"
authors = [
    { name = "sandraschi", email = "sandraschi@users.noreply.github.com" }
]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "twilio>=8.0.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    # webapp backend
    "starlette>=1.0.0",
    "uvicorn[standard]>=0.34.0",
]
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
telephony-mcp = "telephony_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16.0,<0.17"]
